<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vom Licht zum Quant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06070f;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;gap:40px}
.header{text-align:center}
.header h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;color:#38bdf8;margin-bottom:8px}
.header p{color:#64748b;font-size:1rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;width:100%;max-width:820px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:#0f1629;border:1px solid #1e293b;border-radius:16px;padding:28px 24px;text-decoration:none;color:#f1f5f9;transition:border-color .2s,transform .15s;cursor:pointer}
.card:hover,.card:active{border-color:#38bdf8;transform:translateY(-2px)}
.card .ico{font-size:2.2rem;line-height:1}
.card .name{font-size:1.15rem;font-weight:700}
.card .desc{font-size:.88rem;color:#64748b;line-height:1.5}
.card .badge{margin-top:4px;font-size:.75rem;padding:3px 10px;border-radius:20px;font-weight:600}
.badge-lock{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.badge-open{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.card-pres{border-color:#1e3a5f}
.card-pres:hover{border-color:#38bdf8}
.card-spk{border-color:#2d1b69}
.card-spk:hover{border-color:#a78bfa}
.card-hand{border-color:#14432a}
.card-hand:hover{border-color:#34d399}
.footer{color:#334155;font-size:.8rem;text-align:center}
</style>
</head>
<body>
<div class="header">
  <h1>Vom Licht zum Quant</h1>
  <p>Physik · Klasse 9/1 · Gymnasium Berthold Brecht</p>
</div>
<div class="cards">
  <a class="card card-pres" href="presentation.html">
    <span class="ico">📊</span>
    <span class="name">Präsentation</span>
    <span class="desc">Folien für die Klasse — iPad 1</span>
    <span class="badge badge-lock">🔒 Passwort</span>
  </a>
  <a class="card card-spk" href="speaker.html">
    <span class="ico">📋</span>
    <span class="name">Referentennotizen</span>
    <span class="desc">Timer · Notizen · Checkliste — iPad 2</span>
    <span class="badge badge-lock">🔒 Passwort</span>
  </a>
  <a class="card card-hand" href="handout.html">
    <span class="ico">📄</span>
    <span class="name">Handout</span>
    <span class="desc">Schüler-Handout — drucken / PDF</span>
    <span class="badge badge-open">Offen</span>
  </a>
</div>
<p class="footer">Simon Köper · Robin · Lucas</p>
</body>
</html>
